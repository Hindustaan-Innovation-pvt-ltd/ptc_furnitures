version: "3.8"

services:
  mongodb:
    image: mongo:8.0.5
    container_name: furnitures-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furnitures-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ptc_furnitures
      - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=G-R8LPMY4PN7
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID}
      - ADMIN_SMS_RECIPIENT=${ADMIN_SMS_RECIPIENT}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - media_uploads:/app/public/upload

volumes:
  mongodb_data:
  media_uploads:
