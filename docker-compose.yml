version: "3.8"

services:
  mongodb:
    image: mongo:8.0.5
    container_name: furnitures-mongodb
    restart: always
    command: ["--auth"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
    container_name: furnitures-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID}
      - ADMIN_SMS_RECIPIENT=${ADMIN_SMS_RECIPIENT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - BREVO_SMTP=${BREVO_SMTP}
      - BREVO_PORT=${BREVO_PORT}
      - BREVO_USER=${BREVO_USER}
      - BREVO_PASSWORD=${BREVO_PASSWORD}
      - BREVO_SENDER_MAIL=${BREVO_SENDER_MAIL}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./public/upload:/app/public/upload

  mongodb-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: furnitures-mongodb-backup
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - mongodb_backups:/backups
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID}
      - GDRIVE_CLIENT_SECRET=${GDRIVE_CLIENT_SECRET}
      - GDRIVE_REFRESH_TOKEN=${GDRIVE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
      - RETENTION_DRIVE_COUNT=${RETENTION_DRIVE_COUNT:-30}
    env_file:
      - .env

volumes:
  mongodb_data:
  mongodb_backups:
